[project]
name = "startups-radar"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.7",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
